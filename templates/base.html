<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Shifa Genetics DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-wrap">
                <img src="{{ url_for('static', filename='images/alshifa-logo-white.png') }}" alt="Al-Shifa Logo">
            </div>
            <div class="brand-text">
                <h2>Al-Shifa Genetics</h2>
                <span>Database System</span>
            </div>
        </div>
        <ul class="nav-links">
            <li>
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-dna"></i> <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('add_family') }}" class="{% if request.endpoint == 'add_family' %}active{% endif %}">
                    <i class="fa-solid fa-user-plus"></i> <span>Add Family</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('all_samples') }}" class="{% if request.endpoint == 'all_samples' %}active{% endif %}">
                    <i class="fa-solid fa-vial"></i> <span>All Samples</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('view_records') }}" class="{% if request.endpoint == 'view_records' %}active{% endif %}">
                    <i class="fa-solid fa-table"></i> <span>View Records</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('remaining_analysis') }}" class="{% if request.endpoint == 'remaining_analysis' %}active{% endif %}">
                    <i class="fa-solid fa-microscope"></i> <span>Analysis Queue</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">
                    <i class="fa-solid fa-gear"></i> <span>Settings</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="dna-mini">
                <i class="fa-solid fa-dna"></i> v3.0 &middot; Ophthalmic Genetics
            </div>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
