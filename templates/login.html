<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Al-Shifa Genetics DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            background: linear-gradient(160deg, #FFFFFF 0%, #E1F5FE 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(1, 87, 155, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(41, 182, 246, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-wrap {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .login-brand {
            flex: 1;
            background: linear-gradient(180deg, #002f6c 0%, #01579B 50%, #0277BD 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        .login-brand::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(2, 119, 189, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-brand::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(41, 182, 246, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-brand .brand-icon {
            font-size: 4rem;
            color: rgba(2, 119, 189, 0.3);
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }
        .login-brand h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .login-brand p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            margin-top: 8px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .login-brand .dna-art {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            opacity: 0.08;
            font-size: 1.2rem;
            color: white;
            letter-spacing: 4px;
            z-index: 1;
        }
        .login-form-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 47, 108, 0.08);
        }
        .login-card .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #002f6c, #01579B);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(1, 87, 155, 0.2);
        }
        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .login-card .sub {
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1E293B;
        }
        .form-group label i {
            color: #0277BD;
            margin-right: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid rgba(30, 41, 59, 0.08);
            border-radius: 10px;
            background: white;
            font-size: 0.9rem;
            color: #1E293B;
            transition: all 0.25s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0288D1;
            box-shadow: 0 0 0 3px rgba(1, 87, 155, 0.15);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #002f6c, #01579B);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(1, 87, 155, 0.2);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(1, 87, 155, 0.3);
        }
        .btn:active { transform: scale(0.98); }
        .error {
            background: rgba(214, 69, 80, 0.08);
            color: #D64550;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(214, 69, 80, 0.15);
        }
        @media (max-width: 768px) {
            .login-brand { display: none; }
            .login-form-wrap { padding: 24px; }
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='images/lab-logo.png') }}" alt="Al-Shifa Lab Logo" style="width: 110px; margin-bottom: 24px; position: relative; z-index: 1;">
            <h1>Al-Shifa Trust<br>Eye Hospital</h1>
            <p>Ophthalmic Genetics Database</p>
            <div class="dna-art">
                <i class="fa-solid fa-dna"></i>
                <i class="fa-solid fa-dna"></i>
                <i class="fa-solid fa-dna"></i>
            </div>
        </div>
        <div class="login-form-wrap">
            <div class="login-card">
                <div class="card-icon"><i class="fa-solid fa-user-lock"></i></div>
                <h2>Welcome Back</h2>
                <p class="sub">Sign in to access the genetics database</p>

                {% if error %}
                <div class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="form-group">
                        <label><i class="fa-solid fa-user"></i> Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
